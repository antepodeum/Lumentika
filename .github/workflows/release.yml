name: Publish release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify tagged release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      version: ${{ steps.version.outputs.value }}

    steps:
      - name: Check out tagged revision
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Resolve and validate release version
        id: version
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z][0-9A-Za-z.-]*)?$ ]]; then
            echo "Tag must use v<semver>, for example v0.1.0" >&2
            exit 1
          fi
          echo "value=$version" >> "$GITHUB_OUTPUT"

      - name: Run release gate
        run: ./gradlew clean build spotlessCheck -PreleaseVersion=${{ steps.version.outputs.value }}

  publish:
    name: Publish verified artifacts
    needs: verify
    runs-on: ubuntu-latest
    environment: maven-central
    timeout-minutes: 30

    steps:
      - name: Check out tagged revision
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Validate publishing secrets
        shell: bash
        env:
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          MAVEN_SIGNING_KEY: ${{ secrets.MAVEN_SIGNING_KEY }}
          MAVEN_SIGNING_PASSWORD: ${{ secrets.MAVEN_SIGNING_PASSWORD }}
        run: |
          for name in MAVEN_CENTRAL_USERNAME MAVEN_CENTRAL_PASSWORD MAVEN_SIGNING_KEY MAVEN_SIGNING_PASSWORD; do
            if [[ -z "${!name}" ]]; then
              echo "Required maven-central environment secret $name is missing" >&2
              exit 1
            fi
          done

      - name: Publish to Maven Central
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.MAVEN_SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.MAVEN_SIGNING_PASSWORD }}
        run: >-
          ./gradlew
          :lumentika-core:publishAllPublicationsToMavenCentralRepository
          :lumentika-ksp:publishAllPublicationsToMavenCentralRepository
          -PreleaseVersion=${{ needs.verify.outputs.version }}

      - name: Publish to GitHub Packages
        env:
          ORG_GRADLE_PROJECT_gprUser: ${{ github.actor }}
          ORG_GRADLE_PROJECT_gprKey: ${{ secrets.GITHUB_TOKEN }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.MAVEN_SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.MAVEN_SIGNING_PASSWORD }}
        run: >-
          ./gradlew
          :lumentika-core:publishAllPublicationsToGitHubPackagesRepository
          :lumentika-ksp:publishAllPublicationsToGitHubPackagesRepository
          -PreleaseVersion=${{ needs.verify.outputs.version }}

      - name: Create GitHub release with JARs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          gh release create "$GITHUB_REF_NAME"
          lumentika-core/build/libs/*.jar
          lumentika-ksp/build/libs/*.jar
          --verify-tag
          --generate-notes
          --title "Lumentika ${{ needs.verify.outputs.version }}"
